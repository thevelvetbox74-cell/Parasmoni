    <!-- Static & Dynamic LCP Hero Image Preload with matching srcset and sizes -->
    <link 
      rel="preload" 
      as="image" 
      id="hero-lcp-preload"
      href="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=1200" 
      imagesrcset="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=480 480w, https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=768 768w, https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=1080 1080w, https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=1440 1440w, https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=1920 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <script>
      try {
        var cachedData = localStorage.getItem('pm_hero_banner_data');
        var cachedUrl = localStorage.getItem('pm_hero_banner_url');
        var targetUrl = cachedUrl;
        if (cachedData) {
          try {
            var parsed = JSON.parse(cachedData);
            if (parsed && (parsed.image || parsed.desktopImage)) {
              targetUrl = parsed.desktopImage || parsed.image;
            }
          } catch(e){}
        }
        if (targetUrl && targetUrl.indexOf('photo-1599643478518') === -1) {
          var preloadEl = document.getElementById('hero-lcp-preload');
          if (preloadEl) {
            preloadEl.href = targetUrl;
            if (targetUrl.indexOf('ik.imagekit.io') !== -1) {
              var widths = [480, 768, 1080, 1440, 1920];
              var sep = targetUrl.indexOf('?') !== -1 ? '&' : '?';
              var srcsets = widths.map(function(w) {
                return targetUrl + sep + 'tr=w-' + w + ',q-75,f-auto ' + w + 'w';
              }).join(', ');
              preloadEl.setAttribute('imagesrcset', srcsets);
            } else {
              preloadEl.removeAttribute('imagesrcset');
            }
          }
        }
      } catch (e) {}
    </script>
