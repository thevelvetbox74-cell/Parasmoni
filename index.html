      imagesizes="100vw"
      fetchpriority="high"
    />
    <script>
      try {
        var cachedData = localStorage.getItem('pm_hero_banner_data');
        var cachedUrl = localStorage.getItem('pm_hero_banner_url');
        var targetUrl = cachedUrl;
        if (cachedData) {
          try {
            var parsed = JSON.parse(cachedData);
            if (parsed && (parsed.image || parsed.desktopImage)) {
              targetUrl = parsed.desktopImage || parsed.image;
            }
          } catch(e){}
        }
        if (targetUrl && targetUrl.indexOf('photo-1599643478518') === -1) {
          var preloadEl = document.getElementById('hero-lcp-preload');
          var staticImg = document.getElementById('static-hero-img');
          if (preloadEl) {
            preloadEl.href = targetUrl;
            if (targetUrl.indexOf('ik.imagekit.io') !== -1) {
              var widths = [480, 768, 1080, 1440, 1920];
              var sep = targetUrl.indexOf('?') !== -1 ? '&' : '?';
              var srcsets = widths.map(function(w) {
                return targetUrl + sep + 'tr=w-' + w + ',q-75,f-auto ' + w + 'w';
              }).join(', ');
              preloadEl.setAttribute('imagesrcset', srcsets);
              if (staticImg) {
                staticImg.src = targetUrl + sep + 'tr=w-1200,q-75,f-auto';
                staticImg.srcset = srcsets;
              }
            } else {
              preloadEl.removeAttribute('imagesrcset');
              if (staticImg) {
                staticImg.src = targetUrl;
                staticImg.removeAttribute('srcset');
              }
            }
          }
        }
      } catch (e) {}
    </script>
