    <!-- Dynamic & Static LCP Hero Image Preload -->
    <script>
      try {
        var cachedHero = localStorage.getItem('pm_hero_banner_url');
        var heroUrl = cachedHero || 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=1200';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.fetchPriority = 'high';
        link.href = heroUrl;
        document.head.appendChild(link);
      } catch (e) {}
    </script>
