[build]
  command = "vite build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[functions]
  directory = "netlify/functions"

# 1. Immutable Long-Term Caching for Hashed Static Assets (1 Year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# 2. Revalidation for HTML Entry Point
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# 3. Global Security Headers for All Routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Proxy secure ImageKit signatures to Netlify Serverless Functions
[[redirects]]
  force = true
  from = "/api/imagekit-auth"
  status = 200
  to = "/.netlify/functions/imagekit-auth"

# Proxy secure ImageKit asset deletion to Netlify Serverless Functions
[[redirects]]
  force = true
  from = "/api/imagekit-delete/*"
  status = 200
  to = "/.netlify/functions/imagekit-delete"

# Proxy all other general API requests to Netlify Functions
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/:splat"

# Fallback all other client-side paths to index.html for React Router SPA smoothness
[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"
